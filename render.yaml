services:
  - type: web
    name: summabrowse
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set the value in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_VIDEO_MINUTES
        value: "30"
      - key: PROCESS_RATE_LIMIT
        value: "10 per hour;3 per minute"
      - key: VIDEO_RATE_LIMIT
        value: "5 per hour;2 per minute"
